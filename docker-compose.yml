services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: letterport-nginx
    restart: unless-stopped
    ports:
      - "8765:80"
      # - "80:80"
      # - "443:443"
    depends_on:
      - web
      - api
    networks:
      - lms-network
    volumes:
      - ./letterport_data:/app/documents:ro

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: letterport-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    networks:
      - lms-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: letterport-api
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://lms_user:lms_secure_pass@db:5432/letterport_db
      - QUEUE_TYPE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_DIR=/app/documents
    volumes:
      - ./letterport_data:/app/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lms-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: letterport-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://lms_user:lms_secure_pass@db:5432/letterport_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_DIR=/app/documents
    volumes:
      - ./letterport_data:/app/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lms-network

  db:
    image: postgres:16-alpine
    container_name: letterport-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=lms_user
      - POSTGRES_PASSWORD=lms_secure_pass
      - POSTGRES_DB=letterport_db
    volumes:
      - ./db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d letterport_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  redis:
    image: redis:7-alpine
    container_name: letterport-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - lms-network

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: letterport-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge
